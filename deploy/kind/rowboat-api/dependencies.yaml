apiVersion: apps/v1
kind: Deployment
metadata:
  name: rowboat-api-postgres
  labels:
    app.kubernetes.io/name: rowboat-api-postgres
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rowboat-api-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rowboat-api-postgres
        app.kubernetes.io/part-of: rowboat-api-local
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rowboat
            - name: POSTGRES_PASSWORD
              value: rowboat
            - name: POSTGRES_DB
              value: rowboat
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rowboat"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rowboat-api-postgres
  labels:
    app.kubernetes.io/name: rowboat-api-postgres
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  selector:
    app.kubernetes.io/name: rowboat-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rowboat-api-redis
  labels:
    app.kubernetes.io/name: rowboat-api-redis
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rowboat-api-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rowboat-api-redis
        app.kubernetes.io/part-of: rowboat-api-local
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rowboat-api-redis
  labels:
    app.kubernetes.io/name: rowboat-api-redis
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  selector:
    app.kubernetes.io/name: rowboat-api-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rowboat-api-devstack
  labels:
    app.kubernetes.io/name: rowboat-api-devstack
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rowboat-api-devstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rowboat-api-devstack
        app.kubernetes.io/part-of: rowboat-api-local
    spec:
      containers:
        - name: devstack
          image: rowboat-api:kind
          imagePullPolicy: IfNotPresent
          command: ["/devstack"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: ADDR
              value: ":8090"
            - name: ISSUER
              value: http://localhost:18090
            - name: AUDIENCE
              value: rowboat-api
          readinessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rowboat-api-devstack
  labels:
    app.kubernetes.io/name: rowboat-api-devstack
    app.kubernetes.io/part-of: rowboat-api-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rowboat-api-devstack
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 30090

name: Deploy rowboat-api to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "apps/rowboat-api/**"
      - "packages/oauth-resource-server-go/**"
      - ".github/workflows/rowboat-api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rowboat-api-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Fly App
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.ROWBOAT_API_FLY_API_TOKEN }}
      FLY_APP_NAME: ${{ vars.ROWBOAT_API_FLY_APP_NAME || 'oppulence-rowboat-api' }}
      INFISICAL_TOKEN: ${{ secrets.ROWBOAT_INFISICAL_TOKEN || secrets.INFISICAL_TOKEN }}
      INFISICAL_PROJECT_ID: 04ebc1cf-0ec5-4e9e-8ab9-4c6da4252574
      INFISICAL_ENVIRONMENT: prod
      INFISICAL_PATH: /
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "ROWBOAT_API_FLY_API_TOKEN is required"; exit 1; }
          test -n "${INFISICAL_TOKEN:-}" || { echo "ROWBOAT_INFISICAL_TOKEN or INFISICAL_TOKEN is required"; exit 1; }

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          curl -1sLf "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Stage production secrets from Infisical
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "${secret_dir}"' EXIT
          chmod 700 "${secret_dir}"

          infisical export \
            --silent \
            --format=json \
            --projectId="${INFISICAL_PROJECT_ID}" \
            --env="${INFISICAL_ENVIRONMENT}" \
            --path="${INFISICAL_PATH}" \
            --token="${INFISICAL_TOKEN}" > "${secret_dir}/secrets.json"

          required_keys=(
            DATABASE_URL
            MIGRATION_DATABASE_URL
            REDIS_URL
            DB_ENCRYPTION_KEY
            WORKOS_CLIENT_ID
            WORKOS_API_KEY
            JWKS_URL
            HOOK_HMAC_SECRET
            INTERNAL_API_SECRET
            OPENAI_API_KEY
            GOOGLE_OAUTH_CLIENT_ID
            GOOGLE_OAUTH_CLIENT_SECRET
            TEMPORAL_API_KEY
          )
          missing=()
          for key in "${required_keys[@]}"; do
            if ! jq -e --arg key "${key}" '.[] | select(.key == $key)' "${secret_dir}/secrets.json" >/dev/null; then
              missing+=("${key}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Infisical export is missing required keys: ${missing[*]}" >&2
            exit 1
          fi

          jq -r '.[] | "\(.key)=\((.value // "") | @json)"' \
            "${secret_dir}/secrets.json" > "${secret_dir}/secrets.env"
          chmod 600 "${secret_dir}/secrets.env"
          flyctl secrets import --stage --app "${FLY_APP_NAME}" < "${secret_dir}/secrets.env"

      - name: Deploy and converge process topology
        run: apps/rowboat-api/scripts/fly-deploy.sh "${FLY_APP_NAME}"

      - name: Smoke test Fly deployment
        env:
          CONFIGURED_SMOKE_URL: ${{ vars.ROWBOAT_API_FLY_SMOKE_URL }}
        run: |
          set -euo pipefail
          SMOKE_URL="${CONFIGURED_SMOKE_URL:-https://${FLY_APP_NAME}.fly.dev}"
          for path in /healthz /readyz; do
            curl --fail --silent --show-error \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 10 \
              "${SMOKE_URL}${path}" >/dev/null
          done

      - name: Show Fly diagnostics on failure
        if: failure()
        run: |
          flyctl status --app "${FLY_APP_NAME}" || true
          flyctl checks list --app "${FLY_APP_NAME}" || true
          flyctl logs --app "${FLY_APP_NAME}" --no-tail || true

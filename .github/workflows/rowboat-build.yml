name: Rowboat Build

on:
  pull_request:
  # Keep the build available for every develop-to-main promotion PR.

jobs:
  build-rowboat-nextjs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache-dependency-path: "apps/rowboat/package-lock.json"
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/rowboat

      - name: Build Rowboat
        run: npm run build
        working-directory: apps/rowboat

  build-rowboat-www:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the gitleaks history scan can distinguish new
          # commits from content already reviewed on main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache-dependency-path: "apps/rowboat-www/package-lock.json"
          node-version: "24"
          cache: "npm"

      - name: Setup Go for security scanners
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci
        working-directory: apps/rowboat-www

      - name: Install browser quality dependencies
        run: npx playwright install --with-deps chromium
        working-directory: apps/rowboat-www

      - name: Verify rowboat-www
        run: npm run verify:ci
        working-directory: apps/rowboat-www

name: Rowboat Build

on:
  pull_request:
  # Keep the build available for every develop-to-main promotion PR.

jobs:
  build-rowboat-nextjs:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache-dependency-path: 'apps/rowboat/package-lock.json'
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/rowboat
        
      - name: Build Rowboat
        run: npm run build
        working-directory: apps/rowboat

  build-rowboat-www:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache-dependency-path: 'apps/rowboat-www/package-lock.json'
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/rowboat-www
        
      - name: Build rowboat-www
        run: npm run build
        working-directory: apps/rowboat-www

name: Deploy rowboat-www

on:
  push:
    branches: [main]
    paths:
      - "apps/rowboat-www/**"
      - "charts/rowboat-www/**"
      - "scripts/rowboat-www-smoke.sh"
      - ".github/workflows/rowboat-www-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Environment to deploy"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      force_deploy:
        description: "Deploy even if no relevant path changes are detected"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: rowboat-www-${{ github.event.inputs.deploy_environment || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/oppulence-engineering/rowboat-www
  RELEASE_NAME: rowboat-www
  CHART_DIR: charts/rowboat-www

jobs:
  resolve-context:
    name: Resolve Deployment Context
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.context.outputs.app_url }}
      deploy_environment: ${{ steps.context.outputs.deploy_environment }}
      github_environment: ${{ steps.context.outputs.github_environment }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      kube_namespace: ${{ steps.context.outputs.kube_namespace }}
      latest_tag: ${{ steps.context.outputs.latest_tag }}
      short_sha: ${{ steps.context.outputs.short_sha }}
      values_file: ${{ steps.context.outputs.values_file }}
    steps:
      - name: Determine web deployment context
        id: context
        run: |
          set -euo pipefail

          DEPLOY_ENV="${{ github.event.inputs.deploy_environment || 'staging' }}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"

          case "${DEPLOY_ENV}" in
            staging)
              KUBE_NAMESPACE="rowboat-staging"
              VALUES_FILE="charts/rowboat-www/values-staging.yaml"
              APP_URL="https://x.staging.oppulence.io"
              GITHUB_ENVIRONMENT="staging"
              ;;
            production)
              KUBE_NAMESPACE="rowboat"
              VALUES_FILE="charts/rowboat-www/values-production.yaml"
              APP_URL="https://oppulence.io"
              GITHUB_ENVIRONMENT="production"
              ;;
            *)
              echo "unsupported deploy environment: ${DEPLOY_ENV}" >&2
              exit 1
              ;;
          esac

          {
            echo "app_url=${APP_URL}"
            echo "deploy_environment=${DEPLOY_ENV}"
            echo "github_environment=${GITHUB_ENVIRONMENT}"
            echo "image_tag=${DEPLOY_ENV}-${SHORT_SHA}"
            echo "kube_namespace=${KUBE_NAMESPACE}"
            echo "latest_tag=${DEPLOY_ENV}-latest"
            echo "short_sha=${SHORT_SHA}"
            echo "values_file=${VALUES_FILE}"
          } >> "$GITHUB_OUTPUT"

  check-changes:
    name: Determine Deployment Scope
    needs: resolve-context
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'apps/rowboat-www/**'
              - 'charts/rowboat-www/**'
              - 'scripts/rowboat-www-smoke.sh'
              - '.github/workflows/rowboat-www-deploy.yml'

      - name: Decide deploy
        id: decision
        run: |
          set -euo pipefail

          SHOULD_DEPLOY="${{ steps.filter.outputs.app }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_deploy || 'true' }}" == "true" ]]; then
            SHOULD_DEPLOY="true"
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build and Push Image
    needs: [resolve-context, check-changes]
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rowboat-www
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/rowboat-www
          file: apps/rowboat-www/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve-context.outputs.image_tag }}
            ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve-context.outputs.latest_tag }}

  deploy:
    name: Deploy to ${{ needs.resolve-context.outputs.deploy_environment }}
    needs: [resolve-context, check-changes, build-image]
    if: needs.check-changes.outputs.should_deploy == 'true' && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.github_environment }}
    env:
      APP_URL: ${{ needs.resolve-context.outputs.app_url }}
      IMAGE_TAG: ${{ needs.resolve-context.outputs.image_tag }}
      KUBE_NAMESPACE: ${{ needs.resolve-context.outputs.kube_namespace }}
      VALUES_FILE: ${{ needs.resolve-context.outputs.values_file }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Load kubeconfig
        env:
          KUBE_CONFIG_US_EAST: ${{ secrets.KUBE_CONFIG_US_EAST }}
        run: |
          set -euo pipefail

          if [[ -z "${KUBE_CONFIG_US_EAST}" ]]; then
            echo "KUBE_CONFIG_US_EAST is required for rowboat-www deploys"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_US_EAST" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster connection
        run: |
          kubectl get nodes
          kubectl create namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure GHCR image pull secret
        run: |
          set -euo pipefail

          if kubectl -n "${KUBE_NAMESPACE}" get secret ghcr-pull >/dev/null 2>&1; then
            echo "ghcr-pull already exists in ${KUBE_NAMESPACE}"
            exit 0
          fi

          kubectl -n oppulence-canvas-production get secret ghcr-pull -o json \
            | jq 'del(
                .metadata.uid,
                .metadata.resourceVersion,
                .metadata.creationTimestamp,
                .metadata.managedFields,
                .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
              ) | .metadata.namespace=env.KUBE_NAMESPACE' \
            | kubectl apply -f -

      - name: Verify chart contract
        run: |
          set -euo pipefail

          rendered="$(mktemp)"
          helm template "${RELEASE_NAME}" "${CHART_DIR}" \
            -n "${KUBE_NAMESPACE}" \
            -f "${VALUES_FILE}" \
            --set "image.repository=${IMAGE_REPOSITORY}" \
            --set "image.tag=${IMAGE_TAG}" > "${rendered}"

          grep -q 'kind: Deployment' "${rendered}"
          grep -q 'kind: Service' "${rendered}"
          grep -q 'kind: Ingress' "${rendered}"
          grep -q 'kind: HorizontalPodAutoscaler' "${rendered}"
          grep -q 'minReplicas: 2' "${rendered}"
          grep -q 'maxReplicas: 4' "${rendered}"
          grep -q 'averageUtilization: 70' "${rendered}"
          if grep -q 'kind: PodDisruptionBudget' "${rendered}"; then
            echo "rowboat-www must not render a PDB" >&2
            exit 1
          fi

      - name: Deploy Helm chart
        run: |
          set -euo pipefail

          release_status="$(
            helm status "${RELEASE_NAME}" -n "${KUBE_NAMESPACE}" -o json 2>/dev/null \
              | jq -r '.info.status' 2>/dev/null || echo "missing"
          )"
          echo "Current release status: ${release_status}"
          if [[ "${release_status}" == "failed" || "${release_status}" == "pending-install" || "${release_status}" == "pending-upgrade" || "${release_status}" == "pending-rollback" ]]; then
            helm uninstall "${RELEASE_NAME}" -n "${KUBE_NAMESPACE}" --wait --timeout 5m || true
          fi

          helm upgrade --install "${RELEASE_NAME}" "${CHART_DIR}" \
            -n "${KUBE_NAMESPACE}" \
            --create-namespace \
            -f "${VALUES_FILE}" \
            --set "image.repository=${IMAGE_REPOSITORY}" \
            --set "image.tag=${IMAGE_TAG}" \
            --set-string "podAnnotations.rollout-revision=${GITHUB_SHA}" \
            --set-string "podAnnotations.rollout-run-attempt=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait \
            --timeout 10m

      - name: Verify rollout and ingress
        run: |
          set -euo pipefail

          kubectl -n "${KUBE_NAMESPACE}" rollout status deploy/rowboat-www-rowboat-www --timeout=5m
          min_replicas="$(kubectl -n "${KUBE_NAMESPACE}" get hpa rowboat-www-rowboat-www -o jsonpath='{.spec.minReplicas}')"
          max_replicas="$(kubectl -n "${KUBE_NAMESPACE}" get hpa rowboat-www-rowboat-www -o jsonpath='{.spec.maxReplicas}')"
          if [[ "${min_replicas}" != "2" || "${max_replicas}" != "4" ]]; then
            echo "rowboat-www HPA must scale from 2 to 4 replicas, got min=${min_replicas} max=${max_replicas}" >&2
            exit 1
          fi

          if kubectl -n "${KUBE_NAMESPACE}" get pdb -l app.kubernetes.io/instance="${RELEASE_NAME}" --no-headers 2>/dev/null | grep -q .; then
            echo "rowboat-www must not create PDB resources" >&2
            kubectl -n "${KUBE_NAMESPACE}" get pdb -l app.kubernetes.io/instance="${RELEASE_NAME}" || true
            exit 1
          fi

          kubectl -n "${KUBE_NAMESPACE}" get pods,deploy,hpa,ingress,certificate
          kubectl -n "${KUBE_NAMESPACE}" describe ingress rowboat-www-rowboat-www

      - name: Smoke test public site
        env:
          ROWBOAT_WWW_EXPECTED_API_BASE_URL: ${{ needs.resolve-context.outputs.deploy_environment == 'staging' && 'https://api.x.staging.oppulence.io' || 'https://api.oppulence.io' }}
        run: scripts/rowboat-www-smoke.sh "${APP_URL}"

      - name: Diagnose rollout on failure
        if: failure()
        run: |
          set +e

          echo "::group::Pods"
          kubectl -n "${KUBE_NAMESPACE}" get pods -o wide
          echo "::endgroup::"

          echo "::group::Ingress"
          kubectl -n "${KUBE_NAMESPACE}" get hpa,ingress,certificate -o wide
          kubectl -n "${KUBE_NAMESPACE}" describe hpa rowboat-www-rowboat-www
          kubectl -n "${KUBE_NAMESPACE}" describe ingress rowboat-www-rowboat-www
          echo "::endgroup::"

          echo "::group::Describe pods"
          kubectl -n "${KUBE_NAMESPACE}" describe pods -l app.kubernetes.io/instance="${RELEASE_NAME}"
          echo "::endgroup::"

          echo "::group::Pod logs"
          for pod in $(kubectl -n "${KUBE_NAMESPACE}" get pods -l app.kubernetes.io/instance="${RELEASE_NAME}" -o name); do
            echo "--- ${pod} current ---"
            kubectl -n "${KUBE_NAMESPACE}" logs "${pod}" --all-containers --tail=200
            echo "--- ${pod} previous ---"
            kubectl -n "${KUBE_NAMESPACE}" logs "${pod}" --all-containers --previous --tail=200
          done
          echo "::endgroup::"

          echo "::group::Recent non-Normal events"
          kubectl -n "${KUBE_NAMESPACE}" get events --sort-by='.lastTimestamp' --field-selector type!=Normal | tail -100
          echo "::endgroup::"

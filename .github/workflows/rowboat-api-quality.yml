name: Oppulence API Quality

on:
  pull_request:
    paths:
      - "apps/rowboat-api/**"
      - "charts/rowboat-api/**"
      - "packages/rowboat-api-client-ts/**"
      - "docs/trustworthy-first-account-beta/**"
      - "scripts/rowboat-api-kind.sh"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "lefthook.yml"
      - ".github/workflows/rowboat-api-quality.yml"
      - ".github/workflows/rowboat-api-deploy.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/rowboat-api/**"
      - "charts/rowboat-api/**"
      - "packages/rowboat-api-client-ts/**"
      - "docs/trustworthy-first-account-beta/**"
      - "scripts/rowboat-api-kind.sh"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "lefthook.yml"
      - ".github/workflows/rowboat-api-quality.yml"
      - ".github/workflows/rowboat-api-deploy.yml"

permissions:
  contents: read
  security-events: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - name: Formatting, module, and architecture checks
        run: make fmt-check architecture mod-verify
        working-directory: apps/rowboat-api
      - name: Verify quality workflow policy
        run: make policy
        working-directory: apps/rowboat-api
      - name: Test with race detector
        run: go test ./... -race -count=1
        working-directory: apps/rowboat-api
      - name: Vet
        run: go vet ./...
        working-directory: apps/rowboat-api

  # The cloud-scheduler durable lease (RFC 002) relies on Postgres
  # `INSERT ... ON CONFLICT DO NOTHING` semantics, which differ from sqlite, so
  # its cross-replica concurrency guarantee is tested against real Postgres
  # under the `pgconcurrency` build tag (the default suite stays on sqlite).
  lease-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rowboat
          POSTGRES_PASSWORD: rowboat
          POSTGRES_DB: rowboat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rowboat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - name: Schedule-lease concurrency (Postgres)
        run: |
          go test -tags=pgconcurrency -race -count=1 ./cmd/migrate
          go test -tags=pgconcurrency -race -count=1 ./internal/backgroundscheduler/...
        working-directory: apps/rowboat-api
        env:
          ROWBOAT_TEST_PG_DSN: postgres://rowboat:rowboat@localhost:5432/rowboat_test?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/rowboat-api

  generate-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/rowboat-api-client-ts/package-lock.json
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install generation tools
        run: make install-tools
        working-directory: apps/rowboat-api
      - name: Generate API and SDK artifacts
        run: make generate
        working-directory: apps/rowboat-api
      - name: Check generated drift
        run: git diff --exit-code -- apps/rowboat-api packages/rowboat-api-client-ts

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Validate all Helm environments and topology invariants
        run: make helm-validate

  release-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - name: Validate governed release evidence schema
        run: make tfa-release-register-validate
        working-directory: apps/rowboat-api

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/rowboat-api/go.mod
          cache-dependency-path: apps/rowboat-api/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
        working-directory: apps/rowboat-api

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks repository history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build -f apps/rowboat-api/Dockerfile -t rowboat-api:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rowboat-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

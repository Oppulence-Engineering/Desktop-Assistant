name: Desktop Quality Gates

on:
  pull_request:
    paths:
      - 'apps/x/**'
      - '.github/workflows/desktop-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/x/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Run desktop quality gates
        run: npm run quality
        working-directory: apps/x


name: x perf-lite

# The cheap, backend-less slice of the desktop perf gate: build the renderer and
# assert its asset size stays under the rendererAssetSizeMb budget (the same
# tools/desktop-perf/budget.json the full nightly gate uses). The full gate —
# which needs the kind/API stack — stays nightly (desktop-perf-nightly.yml).
on:
  pull_request:
    paths:
      - "apps/x/**"
      - "tools/desktop-perf/budget.json"
      - "scripts/perf-lite.mjs"
      - ".github/workflows/x-perf-lite.yml"

jobs:
  perf-lite:
    name: renderer bundle-size budget
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Build shared/core/preload (TypeScript)
        run: npm run deps
        working-directory: apps/x

      - name: Build renderer
        run: pnpm exec vite build
        working-directory: apps/x/apps/renderer

      - name: Check renderer bundle-size budget
        run: node scripts/perf-lite.mjs

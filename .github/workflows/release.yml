name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and attach distributables for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['apps/x--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/x--tag_name'] }}
      version: ${{ steps.release.outputs['apps/x--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  release-context:
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.context.outputs.release_created }}
      tag_name: ${{ steps.context.outputs.tag_name }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Resolve release context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DISPATCH_TAG_NAME" ]; then
              echo "tag_name is required for manual runs" >&2
              exit 1
            fi

            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$DISPATCH_TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${DISPATCH_TAG_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$RELEASE_CREATED" != "true" ]; then
            RELEASE_CREATED=false
          fi

          echo "release_created=$RELEASE_CREATED" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: release-context
    if: always() && needs.release-context.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.tag_name }}

      - name: Patch forge config (fix volumeName exceeds 27 chars)
        run: |
          CONFIG="apps/x/apps/main/forge.config.cjs"
          if grep -q "volumeName" "$CONFIG"; then
            echo "volumeName already present in forge.config.cjs"
          else
            sed -i '' "s/format: 'ULFO',/format: 'ULFO', volumeName: 'Solomon AI',/" "$CONFIG" \
              && echo "Patched volumeName via sed" \
              || (echo "sed failed, trying perl" && \
                  perl -i -pe "s/(format: .ULFO.,)/\$1 volumeName: .Solomon AI.,/" "$CONFIG")
          fi
          grep -n "volumeName" "$CONFIG" || echo "WARNING: volumeName not found in forge config"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/x/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security find-identity -v "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      # Stage the prebuilt whisper-cli for every arch this job packages (RFC 009).
      # Without this, generateAssets finds an empty vendor dir and ships without
      # on-device transcription. Required: fails the release if binaries are absent.
      - name: Stage whisper-cli binaries (RFC 009)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-whisper-bin.sh darwin arm64
          .github/scripts/stage-whisper-bin.sh darwin x64

      # Stage the dual-track meeting capture helper. Soft gate: without it meetings
      # fall back to in-app capture, so a missing binary warns rather than failing
      # the release.
      - name: Stage audiocap binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-audiocap-bin.sh darwin arm64
          .github/scripts/stage-audiocap-bin.sh darwin x64

      - name: Build electron distributables
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # forge.config.cjs's appleSigningConfigured gate also requires
          # APPLE_CERTIFICATE; without it the gate is false and osxSign/osxNotarize
          # are silently dropped, producing an ad-hoc (unsigned, un-notarized) app.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
        run: |
          rm -rf out
          node --input-type=module - darwin arm64,x64 <<'NODE'
          import { access } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import path from 'node:path';

          const appDir = process.cwd();
          const requireFromApp = createRequire(path.join(appDir, 'package.json'));
          const packager = requireFromApp('@electron/packager');
          const forgeConfig = requireFromApp('./forge.config.cjs');
          const [platform, archCsv] = process.argv.slice(2);
          const arches = archCsv.split(',');
          const packagerConfig = forgeConfig.packagerConfig ?? {};
          const executableName = packagerConfig.executableName ?? 'solomon-ai';
          const appName = packagerConfig.name ?? 'Solomon AI';

          for (const arch of arches) {
            // Re-run generateAssets per arch so the arch-specific whisper-cli
            // (RFC 009) is staged into each package. The JS bundle it also builds
            // is arch-independent; rebuilding it per arch is just redundant work.
            if (forgeConfig.hooks?.generateAssets) {
              await forgeConfig.hooks.generateAssets(forgeConfig, platform, arch);
            }

            const outputPaths = await packager({
              ...packagerConfig,
              dir: appDir,
              name: appName,
              platform,
              arch,
              out: path.join(appDir, 'out'),
              overwrite: true,
            });

            for (const outputPath of outputPaths) {
              console.log(`Packaged app: ${path.relative(appDir, outputPath)}`);
            }

            const binaryPath = platform === 'darwin'
              ? path.join(appDir, 'out', `${appName}-${platform}-${arch}`, `${appName}.app`, 'Contents', 'MacOS', executableName)
              : path.join(appDir, 'out', `${appName}-${platform}-${arch}`, platform === 'win32' ? `${executableName}.exe` : executableName);
            await access(binaryPath);
            console.log(`Verified packaged binary: ${path.relative(appDir, binaryPath)}`);
          }
          NODE
          npx electron-forge make --skip-package --arch=arm64 --platform=darwin --targets "@electron-forge/maker-dmg,@electron-forge/maker-zip"
          npx electron-forge make --skip-package --arch=x64 --platform=darwin --targets "@electron-forge/maker-dmg,@electron-forge/maker-zip"
        working-directory: apps/x/apps/main

      # maker-dmg produces an unsigned .dmg (the app inside is already signed +
      # notarized). Sign, notarize, and staple the disk image too so the download
      # itself passes Gatekeeper on first open — not just the app after install.
      # Must run before "Cleanup keychain" (needs the Developer ID identity).
      - name: Sign + notarize + staple DMGs
        working-directory: apps/x/apps/main
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          # Skip cleanly on unsigned builds (no cert → app wasn't signed either).
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not set — skipping DMG notarization (unsigned build)"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in keychain" >&2
            exit 1
          fi
          find out/make -name '*.dmg' -print0 | while IFS= read -r -d '' dmg; do
            echo "::group::Notarizing $dmg"
            codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
            echo "::endgroup::"
          done

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          artifacts_file="$RUNNER_TEMP/distributables.txt"
          if [ ! -d out/make ]; then
            echo "Expected out/make, but it was not created" >&2
            find out -maxdepth 4 -type f -print 2>/dev/null | sed -n '1,120p' >&2 || true
            exit 1
          fi

          find out/make -type f -print > "$artifacts_file"
          if [ ! -s "$artifacts_file" ]; then
            echo "No distributables were produced in out/make" >&2
            exit 1
          fi

          while IFS= read -r artifact; do
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          done < "$artifacts_file"
        working-directory: apps/x/apps/main

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: distributables-macos
          path: apps/x/apps/main/out/make/**
          if-no-files-found: error
          retention-days: 30

  build-linux:
    needs: release-context
    if: always() && needs.release-context.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/x/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install maker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      # Stage the prebuilt whisper-cli for every arch this job packages (RFC 009).
      - name: Stage whisper-cli binaries (RFC 009)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/stage-whisper-bin.sh linux x64
          .github/scripts/stage-whisper-bin.sh linux arm64

      - name: Build electron distributables
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
        run: |
          rm -rf out
          node --input-type=module - linux x64,arm64 <<'NODE'
          import { access } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import path from 'node:path';

          const appDir = process.cwd();
          const requireFromApp = createRequire(path.join(appDir, 'package.json'));
          const packager = requireFromApp('@electron/packager');
          const forgeConfig = requireFromApp('./forge.config.cjs');
          const [platform, archCsv] = process.argv.slice(2);
          const arches = archCsv.split(',');
          const packagerConfig = forgeConfig.packagerConfig ?? {};
          const executableName = packagerConfig.executableName ?? 'solomon-ai';
          const appName = packagerConfig.name ?? 'Solomon AI';

          for (const arch of arches) {
            // Re-run generateAssets per arch so the arch-specific whisper-cli
            // (RFC 009) is staged into each package. The JS bundle it also builds
            // is arch-independent; rebuilding it per arch is just redundant work.
            if (forgeConfig.hooks?.generateAssets) {
              await forgeConfig.hooks.generateAssets(forgeConfig, platform, arch);
            }

            const outputPaths = await packager({
              ...packagerConfig,
              dir: appDir,
              name: appName,
              platform,
              arch,
              out: path.join(appDir, 'out'),
              overwrite: true,
            });

            for (const outputPath of outputPaths) {
              console.log(`Packaged app: ${path.relative(appDir, outputPath)}`);
            }

            const binaryPath = platform === 'darwin'
              ? path.join(appDir, 'out', `${appName}-${platform}-${arch}`, `${appName}.app`, 'Contents', 'MacOS', executableName)
              : path.join(appDir, 'out', `${appName}-${platform}-${arch}`, platform === 'win32' ? `${executableName}.exe` : executableName);
            await access(binaryPath);
            console.log(`Verified packaged binary: ${path.relative(appDir, binaryPath)}`);
          }
          NODE
          npx electron-forge make --skip-package --arch=x64 --platform=linux --targets "@electron-forge/maker-deb,@electron-forge/maker-rpm,@electron-forge/maker-zip"
          npx electron-forge make --skip-package --arch=arm64 --platform=linux --targets "@electron-forge/maker-deb,@electron-forge/maker-rpm,@electron-forge/maker-zip"
        working-directory: apps/x/apps/main

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        run: |
          artifacts_file="$RUNNER_TEMP/distributables.txt"
          if [ ! -d out/make ]; then
            echo "Expected out/make, but it was not created" >&2
            find out -maxdepth 4 -type f -print 2>/dev/null | sed -n '1,120p' >&2 || true
            exit 1
          fi

          find out/make -type f -print > "$artifacts_file"
          if [ ! -s "$artifacts_file" ]; then
            echo "No distributables were produced in out/make" >&2
            exit 1
          fi

          while IFS= read -r artifact; do
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          done < "$artifacts_file"
        working-directory: apps/x/apps/main

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: distributables-linux
          path: apps/x/apps/main/out/make/**
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: release-context
    if: always() && needs.release-context.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\\AppData\\Local\\electron\\Cache
            ~\\AppData\\Local\\electron-builder\\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/x/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      # Stage the prebuilt whisper-cli for this job's arch (RFC 009). Uses bash
      # (git-bash on the Windows runner) so the shared staging script runs as-is.
      - name: Stage whisper-cli binaries (RFC 009)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/stage-whisper-bin.sh win32 x64

      - name: Build electron distributables
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
        run: |
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          $packageScript = @'
          import { access } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import path from 'node:path';

          const appDir = process.cwd();
          const requireFromApp = createRequire(path.join(appDir, 'package.json'));
          const packager = requireFromApp('@electron/packager');
          const forgeConfig = requireFromApp('./forge.config.cjs');
          const [platform, archCsv] = process.argv.slice(2);
          const arches = archCsv.split(',');
          const packagerConfig = forgeConfig.packagerConfig ?? {};
          const executableName = packagerConfig.executableName ?? 'solomon-ai';
          const appName = packagerConfig.name ?? 'Solomon AI';

          for (const arch of arches) {
            // Re-run generateAssets per arch so the arch-specific whisper-cli
            // (RFC 009) is staged into each package. The JS bundle it also builds
            // is arch-independent; rebuilding it per arch is just redundant work.
            if (forgeConfig.hooks?.generateAssets) {
              await forgeConfig.hooks.generateAssets(forgeConfig, platform, arch);
            }

            const outputPaths = await packager({
              ...packagerConfig,
              dir: appDir,
              name: appName,
              platform,
              arch,
              out: path.join(appDir, 'out'),
              overwrite: true,
            });

            for (const outputPath of outputPaths) {
              console.log(`Packaged app: ${path.relative(appDir, outputPath)}`);
            }

            const binaryPath = platform === 'darwin'
              ? path.join(appDir, 'out', `${appName}-${platform}-${arch}`, `${appName}.app`, 'Contents', 'MacOS', executableName)
              : path.join(appDir, 'out', `${appName}-${platform}-${arch}`, platform === 'win32' ? `${executableName}.exe` : executableName);
            await access(binaryPath);
            console.log(`Verified packaged binary: ${path.relative(appDir, binaryPath)}`);
          }
          '@
          $packageScript | node --input-type=module - win32 x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-forge make --skip-package --arch=x64 --platform=win32 --targets "@electron-forge/maker-squirrel,@electron-forge/maker-zip"
        working-directory: apps/x/apps/main

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag_name }}
        shell: pwsh
        run: |
          if (!(Test-Path "out/make")) {
            if (Test-Path "out") {
              Get-ChildItem -Path "out" -File -Recurse | Select-Object -First 120 | ForEach-Object { Write-Output $_.FullName }
            }
            throw "Expected out/make, but it was not created"
          }

          $artifacts = @(Get-ChildItem -Path "out/make" -File -Recurse)
          if ($artifacts.Count -eq 0) {
            throw "No distributables were produced in out/make"
          }

          foreach ($artifact in $artifacts) {
            gh release upload $env:RELEASE_TAG $artifact.FullName --clobber
          }
        working-directory: apps/x/apps/main

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: distributables-windows
          path: apps/x/apps/main/out/make/**
          if-no-files-found: error
          retention-days: 30

  attach-sbom:
    needs: [release-context, build-macos, build-linux, build-windows]
    if: always() && needs.release-context.outputs.release_created == 'true' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.tag_name }}

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./apps/x
          format: spdx-json
          output-file: solomon-ai-x-${{ needs.release-context.outputs.version }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./apps/x
          format: cyclonedx-json
          output-file: solomon-ai-x-${{ needs.release-context.outputs.version }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Attach SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-context.outputs.tag_name }}" \
            "solomon-ai-x-${{ needs.release-context.outputs.version }}.spdx.json" \
            "solomon-ai-x-${{ needs.release-context.outputs.version }}.cdx.json" \
            --clobber

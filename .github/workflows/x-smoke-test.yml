name: x CI

# Layered PR gate for the desktop app (cheapest checks first, VS Code style):
# install → build deps → renderer typecheck → lint → unit tests → package →
# Playwright-Electron smoke (drives the packaged build via _electron.launch).
on:
  pull_request:
    paths:
      - "apps/x/**"
      - ".github/scripts/x-smoke-package-linux.mjs"
      - ".github/workflows/x-smoke-test.yml"

jobs:
  x-ci-linux:
    name: typecheck · lint · unit · package · e2e
    runs-on: ubuntu-latest
    env:
      # _electron.launch uses the app's own Electron — no Playwright browsers needed.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "apps/x/pnpm-lock.yaml"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/x/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Build shared/core/preload (TypeScript)
        run: npm run deps
        working-directory: apps/x

      # ----- cheapest gates first: typecheck → lint → unit -----
      - name: Typecheck renderer
        run: pnpm exec tsc -b
        working-directory: apps/x/apps/renderer

      - name: Lint apps/x
        run: npm run lint
        working-directory: apps/x

      - name: Unit tests
        run: npm test
        working-directory: apps/x

      # ----- build the product, then drive it -----
      - name: Package electron app (no publish, no signing)
        run: node .github/scripts/x-smoke-package-linux.mjs

      - name: Verify packaged binary exists
        id: packaged-binary
        run: |
          set -euo pipefail

          EXPECTED_BIN="apps/x/apps/main/out/Solomon AI-linux-x64/solomon-ai"
          BIN=""

          for attempt in $(seq 1 60); do
            if [ -f "$EXPECTED_BIN" ]; then
              BIN="$EXPECTED_BIN"
              break
            fi

            BIN="$(find . -path '*/out/*/solomon-ai' -type f -perm -111 -print -quit)"
            if [ -n "$BIN" ]; then
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Waiting for packaged binary from Forge..." >&2
            fi
            sleep 1
          done

          if [ -z "${BIN:-}" ] || [ ! -f "$BIN" ]; then
            echo "Packaged binary not found at $EXPECTED_BIN; searched package output." >&2
            find . -maxdepth 6 -type d -name out -print -exec find {} -maxdepth 3 -type f -print \; | sort | sed 's/^/  /' >&2
            exit 1
          fi

          # Emit an absolute path so the e2e step (run from apps/x/apps/main) resolves it.
          BIN_ABS="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"
          echo "bin=$BIN_ABS" >> "$GITHUB_OUTPUT"
          file "$BIN_ABS"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Playwright-Electron smoke (xvfb)
        run: xvfb-run -a pnpm exec playwright test
        working-directory: apps/x/apps/main
        env:
          ELECTRON_APP_BINARY: ${{ steps.packaged-binary.outputs.bin }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/x/apps/main/playwright-report/
            apps/x/apps/main/test-results/
          if-no-files-found: ignore
          retention-days: 7

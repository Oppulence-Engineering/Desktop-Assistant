# Example External Secrets Operator resources. Replace secret-store names and
# remote paths. Never put real secret values in this file.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth-consent-secrets
  namespace: rowboat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secret-store
  target:
    name: oauth-consent-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: rfc012/production/consent, property: databaseUrl }
    - secretKey: WORKOS_CLIENT_ID
      remoteRef: { key: rfc012/production/consent, property: workosClientId }
    - secretKey: WORKOS_API_KEY
      remoteRef: { key: rfc012/production/consent, property: workosApiKey }
    - secretKey: HOOK_HMAC_SECRET
      remoteRef: { key: rfc012/production/shared, property: hookHmacSecret }
    - secretKey: COOKIE_SECRET
      remoteRef: { key: rfc012/production/consent, property: cookieSecret }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hydra-secrets
  namespace: ory
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secret-store
  target:
    name: hydra-secrets
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef: { key: rfc012/production/hydra, property: dsn }
    - secretKey: secretsSystem
      remoteRef: { key: rfc012/production/hydra, property: systemKeys }
    - secretKey: secretsCookie
      remoteRef: { key: rfc012/production/hydra, property: cookieKeys }

# Values for the UPSTREAM ory/hydra Helm chart (https://k8s.ory.sh/helm/charts).
# This is NOT a wrapper chart — it is the per-environment values file the plan
# calls for. Deploy with:
#
#   helm repo add ory https://k8s.ory.sh/helm/charts
#   helm upgrade --install hydra ory/hydra \
#     -n ory -f charts/hydra/values-production.yaml
#
# The `hydra` Postgres database lives in the managed Postgres instance; the DSN
# and secrets are supplied via the existing Secret `hydra-secrets` with keys:
#   dsn, secretsSystem, secretsCookie. During rotation, secretsSystem and
# secretsCookie are comma-separated current,previous values. Remove the previous
# value only after the maximum refresh/session TTL and a successful canary.

hydra:
  existingSecret: hydra-secrets

  config:
    urls:
      self:
        issuer: https://oauth.solomon-ai.co
        public: https://oauth.solomon-ai.co
      # Login/consent are served by apps/oauth-consent at consent.solomon-ai.co.
      login: https://consent.solomon-ai.co/login
      consent: https://consent.solomon-ai.co/consent
      logout: https://consent.solomon-ai.co/logout
    # CRITICAL: JWT access tokens so rowboat-api and every product MCP can
    # verify tokens offline against Hydra's JWKS (no token introspection call).
    strategies:
      access_token: jwt
    oidc:
      subject_identifiers:
        supported_types:
          - public
    ttl:
      # RFC 012 product resource tokens are deliberately short lived.
      access_token: 5m
      refresh_token: 720h
      id_token: 1h
      auth_code: 10m
    oauth2:
      expose_internal_errors: false

  automigration:
    enabled: true
    type: job

  dangerousForceHttp: false

# Pin the runtime independently of the pinned upstream chart version used by
# the release contract. Renovation requires the real-Hydra render/boot profile.
image:
  repository: oryd/hydra
  tag: v2.3.0
  pullPolicy: IfNotPresent

deployment:
  replicaCount: 2
  podMetadata:
    labels:
      networking.rowboat.dev/network-policy: hydra
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

ingress:
  public:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: oauth.solomon-ai.co
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: hydra-public-tls
        hosts:
          - oauth.solomon-ai.co
  # Admin API stays cluster-internal (never exposed publicly).
  admin:
    enabled: false

serviceMonitor:
  # The admin port is intentionally reachable only by oauth-consent and labeled
  # reconciliation jobs. Do not create a monitor that cannot reach port 4445.
  enabled: false

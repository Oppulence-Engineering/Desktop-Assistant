# Example only. Do not commit a rendered copy with real values.
# Prefer ExternalSecret/SealedSecret in production.
apiVersion: v1
kind: Secret
metadata:
  name: hydra-secrets
  namespace: ory
type: Opaque
stringData:
  dsn: postgres://hydra_app:REPLACE_ME@postgres.example:5432/hydra?sslmode=require
  # Rotation form: NEW_32_BYTE_SECRET,PREVIOUS_32_BYTE_SECRET
  secretsSystem: REPLACE_WITH_OPENSSL_RAND_HEX_32
  secretsCookie: REPLACE_WITH_DISTINCT_OPENSSL_RAND_HEX_32

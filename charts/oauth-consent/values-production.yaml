replicaCount: 2
deploymentEnvironment: production
existingSecret: oauth-consent-secrets
createSecret: false
networkPolicy:
  enabled: true
  postgresql:
    port: 5432
    # REQUIRED deployment input. Supply the production managed PostgreSQL
    # private endpoint CIDR(s) in a separate environment-owned values file.
    cidrs: []
config:
  ORY_ADMIN_URL: http://hydra-admin.ory.svc.cluster.local:4445
  WORKOS_ISSUER: https://auth.solomon-ai.co
  WORKOS_REDIRECT_URI: https://consent.solomon-ai.co/callback
  WORKOS_STEP_UP_REDIRECT_URI: https://consent.solomon-ai.co/step-up/callback
  WORKOS_STEP_UP_ACR: urn:rowboat:loa:money-moving
  WORKOS_STEP_UP_AMR: mfa
  ROWBOAT_API_URL: https://api.oppulence.io
  CONSENT_CONTEXT_HOOK_PATH: /oauth-hooks/pre-consent
  CONSENT_AUDIT_HOOK_PATH: /oauth-hooks/consent-audit
  HOOK_SIGNATURE_MAX_AGE_MS: "300000"
  CONSENT_SESSION_TTL_MS: "600000"
  UPSTREAM_TIMEOUT_MS: "5000"
  COOKIE_SECURE: "true"

# Example only. Store real values in an external secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: oauth-consent-secrets
  namespace: rowboat
type: Opaque
stringData:
  # Use the environment-local direct PostgreSQL endpoint. The chart's migration
  # init container needs DDL access and must not use a transaction-pool DSN.
  DATABASE_URL: postgresql://oauth-consent:replace-me@postgres.example:5432/oauth_consent?sslmode=require
  WORKOS_CLIENT_ID: REPLACE_ME
  WORKOS_API_KEY: REPLACE_ME
  # Must exactly match rowboat-api-secrets.HOOK_HMAC_SECRET.
  HOOK_HMAC_SECRET: REPLACE_WITH_OPENSSL_RAND_HEX_32
  COOKIE_SECRET: REPLACE_WITH_DISTINCT_OPENSSL_RAND_HEX_32

{{- if .Values.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "oauth-consent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretValues }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

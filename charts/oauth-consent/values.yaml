replicaCount: 2
deploymentEnvironment: development

image:
  repository: ghcr.io/oppulence-engineering/oauth-consent
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

port: 3000
service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: consent.solomon-ai.co
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: oauth-consent-tls

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

# Non-secret settings. Keep every URL environment-local. The consent service
# signs context/audit requests with HOOK_HMAC_SECRET from existingSecret.
config:
  ORY_ADMIN_URL: http://hydra-admin.ory.svc.cluster.local:4445
  WORKOS_ISSUER: https://auth.solomon-ai.co
  WORKOS_REDIRECT_URI: https://consent.solomon-ai.co/callback
  WORKOS_STEP_UP_REDIRECT_URI: https://consent.solomon-ai.co/step-up/callback
  WORKOS_STEP_UP_ACR: urn:rowboat:loa:money-moving
  WORKOS_STEP_UP_AMR: mfa
  ROWBOAT_API_URL: https://api.oppulence.io
  CONSENT_CONTEXT_HOOK_PATH: /oauth-hooks/pre-consent
  CONSENT_AUDIT_HOOK_PATH: /oauth-hooks/consent-audit
  HOOK_SIGNATURE_MAX_AGE_MS: "300000"
  CONSENT_SESSION_TTL_MS: "600000"
  UPSTREAM_TIMEOUT_MS: "5000"
  AUDIT_RETRY_INTERVAL_MS: "5000"
  DECISION_LEASE_MS: "30000"
  COOKIE_SECURE: "true"

# Production/staging must use an externally managed Secret. Set createSecret
# only for disposable development clusters. Required keys:
# WORKOS_CLIENT_ID, WORKOS_API_KEY, HOOK_HMAC_SECRET, COOKIE_SECRET, DATABASE_URL.
existingSecret: oauth-consent-secrets
createSecret: false
secretValues: {}

# DATABASE_URL is always read explicitly from this key. A missing key prevents
# both the migration init container and application container from starting.
database:
  urlSecretKey: DATABASE_URL

networkPolicy:
  enabled: true
  hydraAdmin:
    port: 4445
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ory
    podSelector:
      matchLabels:
        app.kubernetes.io/name: hydra
        app.kubernetes.io/instance: hydra
  postgresql:
    port: 5432
    # Explicit database destination CIDRs. Never use 0.0.0.0/0 in production.
    cidrs: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

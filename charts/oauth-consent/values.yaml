replicaCount: 2

image:
  repository: ghcr.io/oppulence-engineering/oauth-consent
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

port: 3000

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: consent.solomon-ai.co
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: oauth-consent-tls

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Non-secret env.
config:
  ORY_ADMIN_URL: http://hydra-admin.ory.svc.cluster.local:4445
  WORKOS_ISSUER: https://auth.solomon-ai.co
  WORKOS_REDIRECT_URI: https://consent.solomon-ai.co/callback
  ROWBOAT_API_URL: https://api.x.solomon-ai.co

# Secret env (WORKOS_CLIENT_ID, WORKOS_API_KEY, HOOK_HMAC_SECRET, COOKIE_SECRET)
# projected from this existing Secret.
existingSecret: oauth-consent-secrets

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

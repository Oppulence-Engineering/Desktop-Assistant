# Default values for rowboat-api. Override per environment via
# values-{production,staging}.yaml.

replicaCount: 2

worker:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

sandbox:
  # Grants the worker service account namespaced access to create/read/delete
  # Kubernetes Jobs and read their Pod logs for the cloud runtime sandbox.run
  # tool. Keep disabled unless CLOUD_RUNTIME_SANDBOX_ENABLED is also true.
  rbac:
    enabled: false

# API-owned scheduler (RFC 001). Disabled by default; enable per-environment.
# replicaCount > 1 is safe: the RFC 002 durable schedule-state lease gives
# cross-replica at-most-once firing. Default 1 is sufficient for current scale.
scheduler:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: "500m"
      memory: 256Mi

image:
  repository: ghcr.io/oppulence-engineering/rowboat-api
  pullPolicy: IfNotPresent
  tag: "" # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Ports the container listens on (must match the binary's defaults / env).
ports:
  http: 8080    # public REST + SSE
  grpc: 8081    # reserved (entproto)
  metrics: 9090 # prometheus

service:
  type: ClusterIP
  annotations: {}
  nodePorts: {}
    # http: 30080
    # grpc: 30081
    # metrics: 30090

ingress:
  enabled: true
  className: nginx
  host: api.x.solomon-ai.co
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSE: never buffer or prematurely time out streamed LLM responses.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: rowboat-api-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Liveness/readiness probes hit the binary's health endpoints.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Prometheus Operator ServiceMonitor (set false if using annotation scraping).
serviceMonitor:
  enabled: false
  interval: 30s

# Prometheus alerts and a Grafana sidecar dashboard for the cloud workflow and
# relationship-worker control planes. Environment overlays enable these only
# where the Prometheus Operator and Grafana sidecar are installed.
observability:
  prometheusRule:
    enabled: false
    additionalLabels: {}
  grafanaDashboard:
    enabled: false
    additionalLabels:
      grafana_dashboard: "1"

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector: {}
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingress:
    # Restricts app traffic to http/grpc ports. Empty selectors allow the
    # cluster's ingress path; production overlays should narrow these.
    from:
      - namespaceSelector: {}
  egress:
    enabled: false
    rules: []

metricsNetworkPolicy:
  enabled: true
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

serviceMesh:
  enabled: false
  istio:
    peerAuthentication:
      enabled: false
      mtlsMode: STRICT

# Non-secret configuration, surfaced as env via a ConfigMap.
config:
  ENVIRONMENT: production
  LOG_LEVEL: info
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  GRPC_ADDR: ":8081"
  READ_TIMEOUT: 30s
  WRITE_TIMEOUT: 5m
  IDLE_TIMEOUT: 120s
  REQUEST_TIMEOUT: 2m
  MAX_REQUEST_BODY_BYTES: "33554432"
  CORS_ALLOWED_ORIGINS: https://app.solomon-ai.co
  AUTO_MIGRATE: "false" # production uses versioned migrations
  APP_URL: https://app.solomon-ai.co
  OIDC_ISSUER_URL: https://oauth.solomon-ai.co
  WEBSOCKET_API_URL: ""
  TOKEN_ISSUER: https://oauth.solomon-ai.co
  TOKEN_AUDIENCE: rowboat-api
  JWKS_URL: https://oauth.solomon-ai.co/.well-known/jwks.json
  WORKOS_CLIENT_ID: ""
  ORY_PUBLIC_URL: https://oauth.solomon-ai.co
  PUBLIC_BASE_URL: https://api.x.solomon-ai.co
  GOOGLE_REDIRECT_URI: https://api.x.solomon-ai.co/oauth/google/callback
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  INFISICAL_ENABLED: "true"
  VENDOR_TIMEOUT: 30s
  VENDOR_RESPONSE_HEADER_TIMEOUT: 15s
  VENDOR_MAX_CONCURRENT: "64"
  LLM_MAX_CONCURRENT: "32"
  # Per-user LLM gateway limits. Sized for agentic traffic: one user action can
  # be ~16 round trips (labeling a batch of emails), and several run at once.
  # These bound burst and abuse, not cost — spend is capped by
  # DAILY_CREDIT_LIMIT / MONTHLY_CREDIT_LIMIT and per-call credit reservation,
  # and LLM_MAX_CONCURRENT bounds what actually reaches the provider.
  LLM_RATE_LIMIT_PER_USER_PER_MINUTE: "600"
  LLM_RATE_LIMIT_PER_USER_BURST_PER_10S: "100"
  UPSTREAM_RESPONSE_MAX_BYTES: "67108864"
  DAILY_CREDIT_LIMIT: "100000"
  MONTHLY_CREDIT_LIMIT: "2000000"
  # Cloud research (RFC 039) draws on a ring-fenced budget as well as the shared
  # caps above. Without it, a busy day of model traffic consumes the shared cap
  # and the nightly account sweep silently stops — the user is asleep for both
  # halves of that. Sized against the promise the plan makes: 250 monitored
  # accounts at 50 credits, polled daily, is 375,000 credits a month.
  RESEARCH_DAILY_CREDIT_LIMIT: "50000"
  RESEARCH_MONTHLY_CREDIT_LIMIT: "500000"
  # Vendor endpoint for cloud research. PARALLEL_API_KEY comes from Infisical and
  # is OPTIONAL: with no key the research surface reports itself unconfigured,
  # the desktop hides the control, and the sweep does nothing. A key alone grants
  # nothing either — the cloud_research capability, an active `intelligence`
  # subscription and per-workspace consent are each required as well.
  PARALLEL_BASE_URL: https://api.parallel.ai
  LLM_ALLOWED_MODELS: ""
  LLM_MAX_PROMPT_BYTES: "2097152"
  LLM_MAX_TOOL_PAYLOAD_BYTES: "1048576"
  LLM_MAX_MESSAGES: "128"
  # Stripe price for the cloud-research tier (RFC 039). An identifier, not a
  # secret. Empty means the plan cannot be bought: checkout answers
  # provider_unconfigured rather than silently falling back to a cheaper price.
  # The credit grant matches MONTHLY_CREDIT_LIMIT — a larger grant would be dead
  # config, because the shared monthly cap binds first.
  STRIPE_INTELLIGENCE_PRICE_ID: ""
  STRIPE_INTELLIGENCE_CREDITS: "2000000"
  GRAPHQL_INTROSPECTION_ENABLED: "false"
  GRAPHQL_MAX_COMPLEXITY: "250"
  GRAPHQL_MAX_DEPTH: "12"
  # Plain (plain.com) feedback relay. Label type ids are workspace data; these
  # are the "Solomon AI" Plain workspace's label types mapped per category
  # (bug→Bug, feature→Feature Request, question→Support, other→General). There
  # is a single Plain workspace, so staging/prod share these ids. Unmapped
  # categories submit unlabelled. PLAIN_API_KEY comes from Infisical.
  PLAIN_API_URL: https://core-api.uk.plain.com/graphql/v1
  PLAIN_LABEL_TYPE_IDS: '{"bug":"lt_01JN2Y0T823VHEYPD9KX3YA3XZ","feature":"lt_01HXTDSYX6SG3V7YB8CNB0YZB5","question":"lt_01JN2Y1BFY6FXD90REETNPWFJA","other":"lt_01JN2Y280HG5F8BH33Q1CDN7E7"}'
  PLAIN_TITLE_PREFIX: ""
  TEMPORAL_ENABLED: "false"
  TEMPORAL_ADDRESS: temporal-frontend.temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_WORKER_ENABLED: "false"
  # Cloud scheduler (RFC 001). CLOUD_SCHEDULER_ENABLED stays false in the shared
  # configmap so only the scheduler Deployment (which sets it true on its own
  # pod) runs the loop; the rest are tunable defaults.
  CLOUD_SCHEDULER_ENABLED: "false"
  CLOUD_SCHEDULER_INTERVAL: 15s
  CLOUD_SCHEDULER_LEASE_TTL: 150s
  CLOUD_SCHEDULER_TIMEZONE: UTC
  # Temporal Schedules for exact-cron api-target tasks (RFC 005). ENABLED BY
  # DEFAULT in the binary; setting TEMPORAL_SCHEDULES_ENABLED: "false" here is
  # the instant rollback (the RFC 001 loop resumes every cron). Inert unless
  # TEMPORAL_ENABLED is true. The flag lives in the SHARED configmap when set
  # (server syncer + worker fires + scheduler reconciler must agree).
  #
  # Operational invariants:
  # - Change TEMPORAL_SCHEDULE_CATCHUP / TEMPORAL_TASK_QUEUE only in this
  #   shared block: they are baked into each schedule's memo and diffed by
  #   both the server's syncer and the scheduler's reconciler, so deployments
  #   disagreeing on these values recreate each other's schedules on every
  #   task write until aligned.
  # - Flag flips (on OR off) apply to all three deployments in one configmap
  #   update; during the rollout skew window occurrences may be skipped (a
  #   disabled worker skips fires while a not-yet-rolled scheduler still
  #   gates the loop) — keep the window short.
  TEMPORAL_SCHEDULE_CATCHUP: 1m
  TEMPORAL_SCHEDULE_RECONCILE_INTERVAL: 5m
  # Admission guardrails for API-native background-task runs. These execute
  # before Temporal workflow start: overload or credit exhaustion creates a
  # failed dead-letter run row instead of failing late in the worker.
  CLOUD_RUN_ADMISSION_ENABLED: "true"
  CLOUD_RUN_MAX_INFLIGHT_GLOBAL: "5000"
  CLOUD_RUN_MAX_INFLIGHT_PER_USER: "50"
  CLOUD_RUN_RATE_LIMIT_GLOBAL_PER_MINUTE: "2000"
  CLOUD_RUN_RATE_LIMIT_PER_USER_PER_MINUTE: "60"
  CLOUD_RUN_CREDIT_PREFLIGHT_ENABLED: "true"
  # Cloud event ingestion + routing (RFC 003). Ingestion endpoints are always
  # mounted; routing (the Temporal workflow matching events to tasks) is gated
  # and requires TEMPORAL_ENABLED=true.
  CLOUD_EVENTS_ROUTING_ENABLED: "false"
  CLOUD_EVENTS_MATCH_THRESHOLD: "0.7"
  CLOUD_EVENTS_ROUTER_MODEL: anthropic/claude-haiku-4-5
  CLOUD_EVENTS_MAX_PAYLOAD_BYTES: "262144"
  # Google watch manager (RFC 003): registers/renews Gmail + Calendar push
  # subscriptions in the scheduler pod. Requires GOOGLE_WEBHOOK_TOKEN and (for
  # Gmail) GMAIL_PUBSUB_TOPIC, whose push subscription must target
  # /v1/webhooks/google?token=<GOOGLE_WEBHOOK_TOKEN>. GCP-side provisioning:
  # apps/rfc/019-google-push-infrastructure.md.
  GOOGLE_WATCH_ENABLED: "false"
  GMAIL_PUBSUB_TOPIC: ""
  GOOGLE_WATCH_INTERVAL: 15m
  GOOGLE_WATCH_RENEW_MARGIN: 24h
  # Cloud agent runtime (RFC 004): the LLM-backed, tool-scoped agent loop the
  # Temporal worker's ExecuteAPITask delegates to. Enabled by default;
  # flipping CLOUD_RUNTIME_ENABLED to "false" is the rollback to the
  # deterministic-artifact NoopRuntime. MAX_DURATION must stay strictly under
  # the 5m Temporal activity timeout (boot validation enforces it).
  CLOUD_RUNTIME_ENABLED: "true"
  CLOUD_RUNTIME_MODEL: anthropic/claude-sonnet-4-5
  CLOUD_RUNTIME_MAX_DURATION: 4m
  CLOUD_RUNTIME_MAX_LLM_CALLS: "12"
  CLOUD_RUNTIME_MAX_TOOL_CALLS: "24"
  CLOUD_RUNTIME_MAX_ARTIFACT_BYTES: "1048576"
  CLOUD_RUNTIME_MAX_EVENT_BYTES: "65536"
  # sandbox.run: optional out-of-process tool for code, browser automation,
  # long-running, or dependency-heavy work. Backends: kubernetes-job or
  # argo-workflow. RBAC is controlled separately by sandbox.rbac.enabled so
  # production can stage env and permissions separately.
  CLOUD_RUNTIME_SANDBOX_ENABLED: "false"
  CLOUD_RUNTIME_SANDBOX_BACKEND: kubernetes-job
  CLOUD_RUNTIME_SANDBOX_IMAGE: python:3.12-slim
  CLOUD_RUNTIME_SANDBOX_ALLOWED_IMAGES: "python:3.12-slim,mcr.microsoft.com/playwright:*"
  CLOUD_RUNTIME_SANDBOX_NAMESPACE: ""
  # Required when CLOUD_RUNTIME_SANDBOX_BACKEND=argo-workflow.
  CLOUD_RUNTIME_SANDBOX_SERVICE_ACCOUNT: ""
  CLOUD_RUNTIME_SANDBOX_MAX_DURATION: 4m
  CLOUD_RUNTIME_SANDBOX_POLL_INTERVAL: 5s
  CLOUD_RUNTIME_SANDBOX_MAX_SCRIPT_BYTES: "32768"
  CLOUD_RUNTIME_SANDBOX_MAX_OUTPUT_BYTES: "65536"
  CLOUD_RUNTIME_SANDBOX_CPU_REQUEST: 100m
  CLOUD_RUNTIME_SANDBOX_MEMORY_REQUEST: 128Mi
  CLOUD_RUNTIME_SANDBOX_CPU_LIMIT: "1"
  CLOUD_RUNTIME_SANDBOX_MEMORY_LIMIT: 1Gi
  CLOUD_RUNTIME_SANDBOX_WORKSPACE_SIZE: 1Gi
  CLOUD_RUNTIME_SANDBOX_TTL_SECONDS: "600"

# Secret env. In production these are projected from an existing Secret
# (existingSecret) rather than templated into the chart. When existingSecret is
# empty, the chart creates a Secret from `secretValues` (dev only).
existingSecret: rowboat-api-secrets
secretValues: {}
  # DATABASE_URL: ""
  # REDIS_URL: ""
  # DB_ENCRYPTION_KEY: ""
  # WORKOS_API_KEY: ""
  # HOOK_HMAC_SECRET: ""
  # INTERNAL_API_SECRET: ""
  # SLACK_SIGNING_SECRET: ""
  # GOOGLE_WEBHOOK_TOKEN: ""
  # WEBHOOK_SIGNING_SECRET: ""
  # SLACK_CLIENT_ID: ""
  # SLACK_CLIENT_SECRET: ""
  # ORY_BROKER_CLIENT_ID: ""
  # ORY_BROKER_CLIENT_SECRET: ""
  # INFISICAL_TOKEN: ""
  # INFISICAL_PROJECT_ID: ""
  # PLAIN_API_KEY: ""
  # PARALLEL_API_KEY: ""   # optional; see PARALLEL_BASE_URL above

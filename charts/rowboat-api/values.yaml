# Default values for rowboat-api. Override per environment via
# values-{production,staging}.yaml.

replicaCount: 2

worker:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# API-owned scheduler (RFC 001). Disabled by default; enable per-environment.
# replicaCount > 1 is safe: the RFC 002 durable schedule-state lease gives
# cross-replica at-most-once firing. Default 1 is sufficient for current scale.
scheduler:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: "500m"
      memory: 256Mi

image:
  repository: ghcr.io/oppulence-engineering/rowboat-api
  pullPolicy: IfNotPresent
  tag: "" # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Ports the container listens on (must match the binary's defaults / env).
ports:
  http: 8080    # public REST + SSE
  grpc: 8081    # reserved (entproto)
  metrics: 9090 # prometheus

service:
  type: ClusterIP
  annotations: {}
  nodePorts: {}
    # http: 30080
    # grpc: 30081
    # metrics: 30090

ingress:
  enabled: true
  className: nginx
  host: api.x.solomon-ai.co
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSE: never buffer or prematurely time out streamed LLM responses.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: rowboat-api-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Liveness/readiness probes hit the binary's health endpoints.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Prometheus Operator ServiceMonitor (set false if using annotation scraping).
serviceMonitor:
  enabled: false
  interval: 30s

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector: {}
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingress:
    # Restricts app traffic to http/grpc ports. Empty selectors allow the
    # cluster's ingress path; production overlays should narrow these.
    from:
      - namespaceSelector: {}
  egress:
    enabled: false
    rules: []

metricsNetworkPolicy:
  enabled: true
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

serviceMesh:
  enabled: false
  istio:
    peerAuthentication:
      enabled: false
      mtlsMode: STRICT

# Non-secret configuration, surfaced as env via a ConfigMap.
config:
  ENVIRONMENT: production
  LOG_LEVEL: info
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  GRPC_ADDR: ":8081"
  READ_TIMEOUT: 30s
  WRITE_TIMEOUT: 5m
  IDLE_TIMEOUT: 120s
  REQUEST_TIMEOUT: 2m
  MAX_REQUEST_BODY_BYTES: "33554432"
  CORS_ALLOWED_ORIGINS: https://app.solomon-ai.co
  AUTO_MIGRATE: "false" # production uses versioned migrations
  APP_URL: https://app.solomon-ai.co
  OIDC_ISSUER_URL: https://oauth.solomon-ai.co
  WEBSOCKET_API_URL: ""
  TOKEN_ISSUER: https://oauth.solomon-ai.co
  TOKEN_AUDIENCE: rowboat-api
  JWKS_URL: https://oauth.solomon-ai.co/.well-known/jwks.json
  WORKOS_CLIENT_ID: ""
  ORY_PUBLIC_URL: https://oauth.solomon-ai.co
  PUBLIC_BASE_URL: https://api.x.solomon-ai.co
  GOOGLE_REDIRECT_URI: https://api.x.solomon-ai.co/oauth/google/callback
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  INFISICAL_ENABLED: "true"
  VENDOR_TIMEOUT: 30s
  VENDOR_RESPONSE_HEADER_TIMEOUT: 15s
  VENDOR_MAX_CONCURRENT: "64"
  LLM_MAX_CONCURRENT: "32"
  UPSTREAM_RESPONSE_MAX_BYTES: "67108864"
  COMPOSIO_RESPONSE_MAX_BYTES: "67108864"
  DAILY_CREDIT_LIMIT: "100000"
  MONTHLY_CREDIT_LIMIT: "2000000"
  LLM_ALLOWED_MODELS: ""
  LLM_MAX_PROMPT_BYTES: "2097152"
  LLM_MAX_TOOL_PAYLOAD_BYTES: "1048576"
  LLM_MAX_MESSAGES: "128"
  GRAPHQL_INTROSPECTION_ENABLED: "false"
  GRAPHQL_MAX_COMPLEXITY: "250"
  GRAPHQL_MAX_DEPTH: "12"
  TEMPORAL_ENABLED: "false"
  TEMPORAL_ADDRESS: temporal-frontend.temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_WORKER_ENABLED: "false"
  # Cloud scheduler (RFC 001). CLOUD_SCHEDULER_ENABLED stays false in the shared
  # configmap so only the scheduler Deployment (which sets it true on its own
  # pod) runs the loop; the rest are tunable defaults.
  CLOUD_SCHEDULER_ENABLED: "false"
  CLOUD_SCHEDULER_INTERVAL: 15s
  CLOUD_SCHEDULER_LEASE_TTL: 150s
  CLOUD_SCHEDULER_TIMEZONE: UTC
  # Cloud event ingestion + routing (RFC 003). Ingestion endpoints are always
  # mounted; routing (the Temporal workflow matching events to tasks) is gated
  # and requires TEMPORAL_ENABLED=true.
  CLOUD_EVENTS_ROUTING_ENABLED: "false"
  CLOUD_EVENTS_MATCH_THRESHOLD: "0.7"
  CLOUD_EVENTS_ROUTER_MODEL: anthropic/claude-haiku-4-5
  CLOUD_EVENTS_MAX_PAYLOAD_BYTES: "262144"

# Secret env. In production these are projected from an existing Secret
# (existingSecret) rather than templated into the chart. When existingSecret is
# empty, the chart creates a Secret from `secretValues` (dev only).
existingSecret: rowboat-api-secrets
secretValues: {}
  # DATABASE_URL: ""
  # REDIS_URL: ""
  # DB_ENCRYPTION_KEY: ""
  # WORKOS_API_KEY: ""
  # HOOK_HMAC_SECRET: ""
  # INTERNAL_API_SECRET: ""
  # SLACK_SIGNING_SECRET: ""
  # GOOGLE_WEBHOOK_TOKEN: ""
  # SLACK_CLIENT_ID: ""
  # SLACK_CLIENT_SECRET: ""
  # ORY_BROKER_CLIENT_ID: ""
  # ORY_BROKER_CLIENT_SECRET: ""
  # INFISICAL_TOKEN: ""
  # INFISICAL_PROJECT_ID: ""

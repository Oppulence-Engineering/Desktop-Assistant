{{- $backend := default "kubernetes-job" (toString .Values.config.CLOUD_RUNTIME_SANDBOX_BACKEND) }}
{{- if and .Values.worker.enabled .Values.sandbox.rbac.enabled (eq $backend "argo-workflow") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rowboat-api.serviceAccountName" . }}.service-account-token
  labels:
    {{- include "rowboat-api.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "rowboat-api.serviceAccountName" . | quote }}
type: kubernetes.io/service-account-token
{{- end }}

{{- /* Only create a Secret when not pointing at an existing one (dev convenience). */ -}}
{{- if and (not .Values.existingSecret) .Values.secretValues -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rowboat-api.secretName" . }}
  labels:
    {{- include "rowboat-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

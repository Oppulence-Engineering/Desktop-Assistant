# Staging overrides. Apply with:
#   helm upgrade --install rowboat-api charts/rowboat-api \
#     -f charts/rowboat-api/values-staging.yaml -n rowboat-staging
replicaCount: 1

ingress:
  host: api.x.staging.solomon-ai.co

autoscaling:
  enabled: false

serviceMonitor:
  enabled: true

observability:
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true

config:
  ENVIRONMENT: staging
  LOG_LEVEL: debug
  AUTO_MIGRATE: "true" # staging may auto-migrate for fast iteration
  APP_URL: https://app.staging.solomon-ai.co
  OIDC_ISSUER_URL: https://oauth.staging.solomon-ai.co
  TOKEN_ISSUER: https://oauth.staging.solomon-ai.co
  JWKS_URL: https://oauth.staging.solomon-ai.co/.well-known/jwks.json
  ORY_PUBLIC_URL: https://oauth.staging.solomon-ai.co
  ORY_ADMIN_URL: http://hydra-admin.ory-staging.svc.cluster.local:4445
  ORY_BROKER_CLIENT_ID: solomon-connector-broker-staging
  CONNECTOR_REDIRECT_ALLOWLIST: solomon-ai-staging://settings/connectors,https://app.staging.solomon-ai.co/settings/connectors
  CONNECTOR_EMERGENCY_DISABLED: ""
  CONNECTOR_ENTITLEMENT_URLS_JSON: '{"canvas":"https://api.canvas.staging.solomon-ai.co/v1/internal/entitlements","corinthian":"https://mcp.corinthian.staging.solomon-ai.co/v1/internal/entitlements","cadence":"https://mcp.cadence.staging.solomon-ai.co/v1/internal/entitlements","conduit":"https://mcp.conduit.staging.solomon-ai.co/v1/internal/entitlements","eigen":"https://mcp.eigen.staging.solomon-ai.co/v1/internal/entitlements","wispr":"https://mcp.wispr.staging.solomon-ai.co/v1/internal/entitlements"}'
  PUBLIC_BASE_URL: https://api.x.staging.solomon-ai.co
  # Staging product verifiers use this issuer and the connector JWKS endpoint on
  # the same rowboat-api origin, never the Hydra JWKS used by the consent flow.
  BROKER_TOKEN_ISSUER: https://api.x.staging.solomon-ai.co
  # Google OAuth broker callback. MUST be the API host (where /oauth/google/callback
  # is served), not APP_URL — the default falls back to APP_URL, which is the app
  # host in staging/prod. Register this exact URI in the Google Cloud OAuth client.
  GOOGLE_REDIRECT_URI: https://api.x.staging.solomon-ai.co/oauth/google/callback
  INFISICAL_ENVIRONMENT: staging
  # Distinguish staging feedback in the shared Plain inbox via the title prefix.
  # There is one Plain workspace, so staging inherits PLAIN_LABEL_TYPE_IDS from
  # values.yaml (no override needed).
  PLAIN_TITLE_PREFIX: "[staging] "
  # --- Temporal Cloud (API-native background task worker) -------------------
  # Staging deliberately mirrors the production workflow topology. Promotion
  # is only safe after this environment has run the exact candidate image with
  # its API, worker, scheduler, event router, watches, and revenue loops active.
  # TEMPORAL_API_KEY remains in rowboat-api-secrets / Infisical.
  TEMPORAL_ENABLED: "true"
  TEMPORAL_ADDRESS: rowboat-staging.kpisa.tmprl.cloud:7233
  TEMPORAL_NAMESPACE: rowboat-staging.kpisa
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_TLS_ENABLED: "true"
  TEMPORAL_WORKER_ENABLED: "true"
  CLOUD_EVENTS_ROUTING_ENABLED: "true"
  GOOGLE_WATCH_ENABLED: "true"
  REVENUE_AUTO_SCAN_ENABLED: "true"
  REVENUE_MAIL_PUSH_SYNC_ENABLED: "true"

worker:
  enabled: true
  replicaCount: 2

scheduler:
  enabled: true
  replicaCount: 2

existingSecret: rowboat-api-secrets

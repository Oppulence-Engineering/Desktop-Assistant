# Local kind overrides. This intentionally exercises the real rowboat-api Helm
# chart while swapping production dependencies for in-cluster dev services.
#
# Deploy with:
#   scripts/rowboat-api-kind.sh up

fullnameOverride: rowboat-api
replicaCount: 1

image:
  repository: rowboat-api
  pullPolicy: IfNotPresent
  tag: kind

ingress:
  enabled: false

service:
  type: NodePort
  nodePorts:
    http: 30080

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 12

config:
  ENVIRONMENT: development
  LOG_LEVEL: debug
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  GRPC_ADDR: ":8081"
  AUTO_MIGRATE: "true"

  # Host-reachable URLs are what the desktop sees through kind port mappings.
  APP_URL: http://localhost:18080
  OIDC_ISSUER_URL: http://localhost:18090
  TOKEN_ISSUER: http://localhost:18090
  TOKEN_AUDIENCE: rowboat-api

  # rowboat-api runs inside kind, so it reaches devstack via Kubernetes DNS.
  JWKS_URL: http://rowboat-api-devstack:8090/.well-known/jwks.json
  WORKOS_BASE_URL: http://rowboat-api-devstack:8090
  WORKOS_AUTHORIZE_BASE_URL: http://localhost:18090

  ORY_PUBLIC_URL: http://localhost:18090
  PUBLIC_BASE_URL: http://localhost:18080
  # kind uses the Infisical CLI to create rowboat-api-secrets before Helm
  # deploys. Runtime app-level Infisical refresh stays disabled.
  INFISICAL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

  OPENAI_BASE_URL: http://rowboat-api-devstack:8090/v1
  OPENROUTER_BASE_URL: http://rowboat-api-devstack:8090/v1
  GOOGLE_AUTHORIZE_URL: http://localhost:18090/o/oauth2/v2/auth
  GOOGLE_TOKEN_URL: http://rowboat-api-devstack:8090/v1/google-oauth-mock/token
  GOOGLE_REDIRECT_URI: http://localhost:18080/oauth/google/callback
  TEMPORAL_ENABLED: "true"
  TEMPORAL_ADDRESS: rowboat-api-temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_WORKER_ENABLED: "false"
  READINESS_TIMEOUT: 20s

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: "1"
      memory: 512Mi

existingSecret: rowboat-api-secrets
secretValues: {}

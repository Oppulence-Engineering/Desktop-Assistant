# Production overrides (US-East primary). Apply with:
#   helm upgrade --install rowboat-api charts/rowboat-api \
#     -f charts/rowboat-api/values-production.yaml -n rowboat
replicaCount: 3

image:
  repository: ghcr.io/oppulence-engineering/desktop-assistant-rowboat-api
  tag: "" # set by CI to the released git SHA / tag

imagePullSecrets:
  - name: ghcr-pull

ingress:
  host: api.oppulence.io
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

serviceMonitor:
  enabled: false

config:
  ENVIRONMENT: production
  LOG_LEVEL: info
  AUTO_MIGRATE: "false"
  APP_URL: https://oppulence.io
  CORS_ALLOWED_ORIGINS: https://oppulence.io
  OIDC_ISSUER_URL: https://agile-glow-66.authkit.app
  # WorkOS access tokens are verified against this issuer and the JWKS_URL
  # stored in rowboat-api-secrets. WorkOS-direct tokens carry no aud, so the
  # audience check stays explicitly disabled.
  TOKEN_ISSUER: https://api.workos.com
  TOKEN_AUDIENCE: ""
  JWKS_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  PUBLIC_BASE_URL: https://api.oppulence.io
  WEBSOCKET_API_URL: wss://api.oppulence.io
  # Google OAuth broker callback — the API host serving /oauth/google/callback (NOT
  # APP_URL, which the default would use). Register this exact URI in Google Cloud.
  GOOGLE_REDIRECT_URI: https://api.oppulence.io/oauth/google/callback
  # Slack OAuth callback served by this API. Register this exact URI in the
  # Slack app alongside the production client credentials.
  SLACK_REDIRECT_URI: https://api.oppulence.io/oauth/slack/callback
  # Production secrets are synced from Infisical into `rowboat-api-secrets`
  # before Helm deploys. Runtime app-level Infisical refresh stays disabled so
  # the app does not need an Infisical machine token at boot.
  INFISICAL_ENABLED: "false"
  # Signed-in desktop inference/transcription. OpenAI is the fleet default;
  # OpenRouter remains available for explicitly selected Anthropic models.
  LLM_ALLOWED_MODELS: openai/gpt-4.1-mini,openai/gpt-4.1,anthropic/claude-haiku-4-5,anthropic/claude-sonnet-4-5
  TRANSCRIPTION_VOICE_DEFAULT: solomon
  TRANSCRIPTION_MEETING_DEFAULT: solomon
  CLOUD_RUNTIME_MODEL: openai/gpt-4.1-mini
  CLOUD_EVENTS_ROUTER_MODEL: openai/gpt-4.1-mini
  # --- Temporal Cloud (API-native background task worker) -------------------
  # Production executes API-target runs on the dedicated Rowboat Temporal Cloud
  # namespace using API-key auth over TLS. TEMPORAL_API_KEY lives only in
  # rowboat-api-secrets / Infisical.
  TEMPORAL_ENABLED: "true"
  TEMPORAL_ADDRESS: rowboat-production.kpisa.tmprl.cloud:7233
  TEMPORAL_NAMESPACE: rowboat-production.kpisa
  TEMPORAL_TASK_QUEUE: rowboat-api-background-tasks
  TEMPORAL_TLS_ENABLED: "true"
  TEMPORAL_WORKER_ENABLED: "true"
  CLOUD_EVENTS_ROUTING_ENABLED: "true"
  GOOGLE_WATCH_ENABLED: "true"
  REVENUE_AUTO_SCAN_ENABLED: "true"
  REVENUE_MAIL_PUSH_SYNC_ENABLED: "true"

worker:
  enabled: true
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65

scheduler:
  enabled: true
  replicaCount: 2

# Secrets live in the cluster Secret `rowboat-api-secrets` (sealed-secrets /
# external-secrets / Infisical operator). Do NOT inline secret values here.
#
# Required database/cache values in that Secret:
#   postgresql://rowboat_app:<password>@oppulence-storage-do-user-14647471-0.l.db.ondigitalocean.com:25061/solomonai-desktop-backend-db-pool?sslmode=require
#   rediss://default:<password>@solomon-ai-redis-cluster-do-user-14647471-0.b.db.ondigitalocean.com:25061
#
# DATABASE_URL points at the DigitalOcean PgBouncer transaction pool
# `solomonai-desktop-backend-db-pool`, backed by database
# `solomonai-desktop-backend-db` on the `oppulence-storage` cluster. This uses
# the public TLS pool endpoint because the Kubernetes production cluster is not
# on the DigitalOcean private database network. Keep Rowboat on the pool
# endpoint rather than the direct Postgres port so the API, worker, and
# scheduler replicas do not exhaust backend connection slots.
#
# REDIS_URL points at the existing DigitalOcean Valkey cluster
# `solomon-ai-redis-cluster` over the public TLS endpoint for the same network
# reachability reason.
existingSecret: rowboat-api-secrets

{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rowboat-www.fullname" . }}-secrets
  labels:
    {{- include "rowboat-www.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

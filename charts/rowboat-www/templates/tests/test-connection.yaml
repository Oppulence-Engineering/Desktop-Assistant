apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rowboat-www.fullname" . }}-test-connection"
  labels:
    {{- include "rowboat-www.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args: ["-qO-", "http://{{ include "rowboat-www.fullname" . }}/healthz"]
  restartPolicy: Never

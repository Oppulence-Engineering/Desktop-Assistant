<?xml version="1.0" encoding="UTF-8"?>
<!--
  Safari pinned-tab mask. Safari renders this as a flat single-color silhouette
  (it ignores fills and applies the user's tint), so the four-tile Opulence mark
  is reduced to its outlines rather than reusing the full-color PNG.
  Geometry matches assets/brand/opulence-mark-1024.png on a 700x700 canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <g fill="#000000">
    <rect x="16" y="11" width="330" height="335" rx="72" ry="72"/>
    <rect x="350" y="66" width="330" height="280" rx="72" ry="72"/>
    <rect x="22" y="350" width="324" height="296" rx="72" ry="72"/>
    <rect x="350" y="350" width="330" height="339" rx="72" ry="72"/>
  </g>
</svg>

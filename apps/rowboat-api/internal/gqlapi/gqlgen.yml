# gqlgen config for the rowboat-api GraphQL server. Run from this directory
# (via `go generate ./internal/gqlapi/...`) so relative paths resolve here.
# The schema is generated by entgql (ent.graphql); resolvers delegate to ent.
schema:
  - ent.graphql
  - extra.graphql

exec:
  filename: generated.go
  package: gqlapi

model:
  filename: models_gen.go
  package: gqlapi

resolver:
  layout: follow-schema
  dir: .
  package: gqlapi
  filename_template: "{name}.resolvers.go"

# Bind GraphQL types to the entgql-generated ent types.
autobind:
  - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/ent

models:
  # Primary keys (ID) and uuid fields (UUID) both map to uuid.UUID via the
  # gqlid.UUID alias, whose package carries the Marshal/Unmarshal functions
  # gqlgen needs (it looks for them in the model's package).
  ID:
    model:
      - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/internal/gqlid.UUID
  UUID:
    model:
      - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/internal/gqlid.UUID
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Node:
    model:
      - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/ent.Noder
  Cursor:
    model:
      - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/ent.Cursor
  PageInfo:
    model:
      - github.com/Oppulence-Engineering/rowboat/apps/rowboat-api/ent.PageInfo

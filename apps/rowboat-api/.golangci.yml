# golangci-lint v2 configuration for rowboat-api.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
  exclusions:
    generated: lax # auto-skip files with a "Code generated" header (ent, gql, proto)
    paths:
      - bin
      - ent/proto # generated protobuf/gRPC bindings (entproto + protoc)
    rules:
      # internal/crypto and internal/version intentionally shadow stdlib names;
      # they are internal packages and never imported as the bare stdlib name.
      - linters: [revive]
        text: "avoid package names that conflict with"

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - ent
      - ent/proto

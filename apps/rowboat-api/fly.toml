# The deploy script overrides this default with the explicitly supplied
# globally unique app name. Replace it if you prefer to run flyctl directly.
app = "rowboat-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/rowboat-api/Dockerfile"

[deploy]
  release_command = "/rowboat-api-migrate apply"
  release_command_timeout = "10m"
  strategy = "rolling"

[processes]
  app = "/rowboat-api"
  worker = "/rowboat-api-worker"
  scheduler = "/rowboat-api-scheduler"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  HTTP_ADDR = ":8080"
  GRPC_ADDR = ":8081"
  METRICS_ADDR = ":9090"
  AUTO_MIGRATE = "false"
  DB_MAX_OPEN_CONNS = "5"
  INFISICAL_ENABLED = "false"
  TOKEN_AUDIENCE = ""
  TEMPORAL_ENABLED = "true"
  TEMPORAL_TLS_ENABLED = "true"
  CLOUD_SCHEDULER_ENABLED = "true"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Fly only enforces this minimum in the primary region. The sjc Machine may
  # stop while idle and cold-start on West Coast traffic to reduce spend.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[checks.worker_readiness]
  processes = ["worker"]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  port = 9090
  timeout = "5s"
  type = "http"

[checks.scheduler_readiness]
  processes = ["scheduler"]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  port = 9090
  timeout = "5s"
  type = "http"

[[metrics]]
  processes = ["app"]
  port = 9090
  path = "/metrics"

[[metrics]]
  processes = ["worker"]
  port = 9090
  path = "/metrics"

[[metrics]]
  processes = ["scheduler"]
  port = 9090
  path = "/metrics"

[[vm]]
  processes = ["app", "worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  processes = ["worker", "scheduler"]
  policy = "always"

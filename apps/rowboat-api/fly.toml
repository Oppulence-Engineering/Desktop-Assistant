# The deploy script overrides this default with the explicitly supplied
# globally unique app name. Replace it if you prefer to run flyctl directly.
app = "rowboat-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/rowboat-api-migrate apply"
  release_command_timeout = "10m"
  strategy = "rolling"

[processes]
  app = "/rowboat-api"
  worker = "/rowboat-api-worker"
  scheduler = "/rowboat-api-scheduler"

[env]
  APP_URL = "https://oppulence.io"
  CORS_ALLOWED_ORIGINS = "https://oppulence.io"
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  HTTP_ADDR = ":8080"
  GRPC_ADDR = ":8081"
  METRICS_ADDR = ":9090"
  AUTO_MIGRATE = "false"
  DB_MAX_OPEN_CONNS = "5"
  INFISICAL_ENABLED = "false"
  OIDC_ISSUER_URL = "https://agile-glow-66.authkit.app"
  TOKEN_ISSUER = "https://api.workos.com"
  PUBLIC_BASE_URL = "https://api.oppulence.io"
  WEBSOCKET_API_URL = "wss://api.oppulence.io"
  GOOGLE_REDIRECT_URI = "https://api.oppulence.io/oauth/google/callback"
  SLACK_REDIRECT_URI = "https://api.oppulence.io/oauth/slack/callback"
  LLM_ALLOWED_MODELS = "openai/gpt-4.1-mini,openai/gpt-4.1,anthropic/claude-haiku-4-5,anthropic/claude-sonnet-4-5,google/gemini-3.1-flash-lite,openai/text-embedding-3-small"
  TRANSCRIPTION_VOICE_DEFAULT = "solomon"
  TRANSCRIPTION_MEETING_DEFAULT = "solomon"
  CLOUD_RUNTIME_MODEL = "openai/gpt-4.1-mini"
  CLOUD_EVENTS_ROUTER_MODEL = "openai/gpt-4.1-mini"
  TEMPORAL_ENABLED = "true"
  TEMPORAL_ADDRESS = "rowboat-production.kpisa.tmprl.cloud:7233"
  TEMPORAL_NAMESPACE = "rowboat-production.kpisa"
  TEMPORAL_TASK_QUEUE = "rowboat-api-background-tasks"
  TEMPORAL_TLS_ENABLED = "true"
  TEMPORAL_WORKER_ENABLED = "true"
  CLOUD_EVENTS_ROUTING_ENABLED = "true"
  CLOUD_SCHEDULER_ENABLED = "true"
  GOOGLE_WATCH_ENABLED = "true"
  REVENUE_AUTO_SCAN_ENABLED = "true"
  REVENUE_MAIL_PUSH_SYNC_ENABLED = "true"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[checks.worker_readiness]
  processes = ["worker"]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  port = 9090
  timeout = "5s"
  type = "http"

[checks.scheduler_readiness]
  processes = ["scheduler"]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  port = 9090
  timeout = "5s"
  type = "http"

[[metrics]]
  processes = ["app"]
  port = 9090
  path = "/metrics"

[[metrics]]
  processes = ["worker"]
  port = 9090
  path = "/metrics"

[[metrics]]
  processes = ["scheduler"]
  port = 9090
  path = "/metrics"

[[vm]]
  processes = ["app", "worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["scheduler"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  processes = ["worker", "scheduler"]
  policy = "always"

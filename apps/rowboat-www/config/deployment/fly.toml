app = "oppulence-rowboat-www"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../Dockerfile"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  ROWBOAT_WWW_API_PROXY_URL = "https://api.oppulence.io"
  ROWBOAT_WWW_PORT = "8080"
  ROWBOAT_WWW_PUBLIC_API_BASE_URL = "https://api.oppulence.io"
  ROWBOAT_WWW_PUBLIC_APP_URL = "https://oppulence.io"
  ROWBOAT_WWW_WORKOS_PROVIDER = "GoogleOAuth"

[deploy]
  strategy = "bluegreen"
  wait_timeout = "10m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  persist_rootfs = "never"

# Lefthook — repo-wide git hooks for this polyglot monorepo (Go + TypeScript + Next.js).
#
# Why lefthook (not husky+lint-staged): the repo root is not a JS package, so a
# single language-agnostic hook runner that can format Go *and* TypeScript from
# one config is the cleanest fit. See docs/ENGINEERING_QUALITY_GATES_PLAN.md §5.
#
# Setup:   pnpm install --ignore-workspace   (runs `lefthook install` via prepare)
#   or:    pnpm hooks:install
# Run now: pnpm hooks:run            (pre-commit against all files)
# Bypass:  git commit --no-verify    /  LEFTHOOK=0 git push
#
# Desktop commits deliberately run the complete architecture gauntlet after staged
# file mutation. Pre-push and CI repeat it as authoritative defense in depth.
min_version: 1.10.0

# Don't run hooks during merge/rebase resolution.
skip_output:
  - meta
  - summary

pre-commit:
  # Sequential ordering prevents the final verification command from racing with
  # ESLint/Prettier/goimports commands that modify and re-stage files.
  parallel: false
  commands:
    # Lint + autofix staged desktop TypeScript. `root:` rebases {staged_files}
    # to apps/x and runs there so the local eslint + flat config resolve.
    desktop-eslint:
      priority: 10
      root: "apps/x/"
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm exec eslint --config config/eslint.config.mts --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    # Format every staged file Prettier understands (TS/JS/JSON/CSS/MD/YAML…),
    # using the root Prettier + .prettierignore. --ignore-unknown skips the rest.
    prettier:
      priority: 20
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # Go: gofmt staged files, then vet the perf tool if it changed.
    gofmt:
      priority: 10
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    # rowboat-api codegen: when ent schemas or gqlgen inputs are staged, run
    # the generators and stage their output, so CI's generate-drift check
    # can't fail on a forgotten regen (the PR #50 → #56 incident: a new ent
    # entity landed without its openapi/gqlgen/SDK artifacts). Exception to
    # the fast-hook rule above, deliberately: it only fires on schema-input
    # commits, which are rare and already expensive to get wrong. proto
    # regen is CI-only (needs protoc + plugins via `make install-tools`).
    rowboat-api-codegen:
      priority: 1
      root: "apps/rowboat-api/"
      glob:
        - "apps/rowboat-api/ent/schema/*.go"
        - "apps/rowboat-api/ent/schema/mixin/*.go"
        - "apps/rowboat-api/internal/gqlapi/gqlgen.yml"
        - "apps/rowboat-api/internal/gqlapi/extra.graphql"
      run: make ent-generate gql-generate sdk-generate
      stage_fixed: true
    perf-tool-vet:
      priority: 30
      glob: "tools/desktop-perf/**/*.go"
      root: "tools/desktop-perf/"
      run: go vet ./...
    # Run the same one-command gate used by pre-push. It is last because earlier
    # hook commands can rewrite and re-stage source/configuration files.
    desktop-verify:
      # Lefthook treats priority 0 as +Infinity, so this runs after every
      # explicitly prioritized mutation/check above.
      priority: 0
      root: "apps/x/"
      glob: "apps/x/**"
      run: pnpm verify

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# pre-push runs the slower checks once, before sharing code — too slow for every
# commit, faster than waiting on CI. Skip on WIP branches with `LEFTHOOK=0 git push`.
#
# One sequential command on purpose: the renderer typecheck needs a FRESH
# @x/shared/@x/preload build, and `pnpm test` rebuilds @x/shared too — running
# them in parallel races on packages/shared/dist (a half-rebuilt dist makes tsc
# fail with "Cannot find @x/shared/dist/*.js"). `typecheck` builds deps first,
# then tsc -b; tests run after.
pre-push:
  commands:
    desktop-checks:
      root: "apps/x/"
      run: pnpm run verify

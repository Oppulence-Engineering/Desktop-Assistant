# Lefthook — repo-wide git hooks for this polyglot monorepo (Go + TypeScript + Next.js).
#
# Why lefthook (not husky+lint-staged): the repo root is not a JS package, so a
# single language-agnostic hook runner that can format Go *and* TypeScript from
# one config is the cleanest fit. See docs/ENGINEERING_QUALITY_GATES_PLAN.md §5.
#
# Setup:   pnpm install --ignore-workspace   (runs `lefthook install` via prepare)
#   or:    pnpm hooks:install
# Run now: pnpm hooks:run            (pre-commit against all files)
# Bypass:  git commit --no-verify    /  LEFTHOOK=0 git push
#
# Desktop commits deliberately run the complete architecture gauntlet after staged
# file mutation. Pre-push and CI repeat it as authoritative defense in depth.
min_version: 1.10.0

# Don't run hooks during merge/rebase resolution.
skip_output:
  - meta
  - summary

pre-commit:
  # Sequential ordering prevents the final verification command from racing with
  # ESLint/Prettier/goimports commands that modify and re-stage files.
  parallel: false
  commands:
    # Lint + autofix staged desktop TypeScript. `root:` rebases {staged_files}
    # to apps/x and runs there so the local eslint + flat config resolve.
    desktop-eslint:
      priority: 10
      root: "apps/x/"
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm exec eslint --config config/eslint.config.mts --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    rowboat-www-eslint:
      priority: 10
      root: "apps/rowboat-www/"
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: npm exec eslint -- --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    rowboat-www-component-contracts:
      priority: 30
      root: "apps/rowboat-www/"
      glob:
        - "components/**/*.{ts,tsx}"
        - "app/**/_components/**/*.{ts,tsx}"
        - "component-architecture.json"
        - "components.json"
      run: npm test
    rowboat-www-growth-standard:
      priority: 30
      root: "apps/rowboat-www/"
      glob:
        - "app/(product)/**/*.{ts,tsx}"
        - "components/features/**/*.{ts,tsx}"
        - "hooks/queries/**/*.ts"
        - "stores/**/*.ts"
        - "config/generate/**"
        - "scripts/generate/**"
        - "quality/generate-*.test.ts"
        - "config/architecture/generator-baseline.json"
      run: npm run gen:check
    # Scan only the staged diff for immediate credential feedback. CI scans
    # full history independently.
    gitleaks-staged:
      priority: 30
      run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --staged --gitleaks-ignore-path .gitleaksignore --redact --no-banner .
    # Format every staged file Prettier understands (TS/JS/JSON/CSS/MD/YAML…),
    # using the root Prettier + .prettierignore. --ignore-unknown skips the rest.
    prettier:
      priority: 20
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # Go: goimports includes gofmt and canonical import grouping. The tool is
    # version-pinned to the rowboat-api Makefile/toolchain.
    goimports:
      priority: 10
      glob: "*.go"
      run: go run golang.org/x/tools/cmd/goimports@v0.49.0 -w {staged_files}
      stage_fixed: true
    # rowboat-api contract drift: when an entity or public API contract source
    # is staged, reproduce every consumer of that contract and reject the
    # commit if any generated output differs from the index.
    # This includes the public SDK and the web BFF's runtime Zod schemas.
    # Exception to the fast-hook rule above, deliberately: contract changes are
    # rare, and rejecting drift before commit is cheaper than a runtime parser
    # rejecting fields that the API already returns. Proto regeneration remains
    # CI-only because it requires protoc and its plugins.
    rowboat-api-contract-drift:
      priority: 1
      root: "apps/rowboat-api/"
      glob:
        - "apps/rowboat-api/api/openapi.json"
        - "apps/rowboat-api/ent/schema/**/*.go"
        - "apps/rowboat-api/internal/openapidoc/**/*.go"
        - "apps/rowboat-api/internal/gqlapi/gqlgen.yml"
        - "apps/rowboat-api/internal/gqlapi/extra.graphql"
      run: make contract-generate-check
    # Catch manual edits and generator/configuration changes even when no API
    # source file triggered the auto-generation command above. The checker
    # generates into a temporary directory and compares content hashes, so it
    # never mutates a developer's working tree.
    rowboat-www-contract-drift:
      priority: 0
      glob:
        - "apps/rowboat-api/api/openapi.json"
        - "apps/rowboat-www/config/contracts/**"
        - "apps/rowboat-www/lib/api/generated/**"
        - "apps/rowboat-www/scripts/check-generated-contracts.mjs"
      run: npm --prefix apps/rowboat-www run contracts:check
    # Cheap API policy checks run on commits that can alter database contracts.
    # Full verification remains the pre-push gate below.
    rowboat-api-schema-policy:
      priority: 30
      root: "apps/rowboat-api/"
      glob:
        - "apps/rowboat-api/ent/schema/**/*.go"
        - "apps/rowboat-api/migrations/postgres/**"
        - "apps/rowboat-api/cmd/migrate/**/*.go"
      run: make fmt-check architecture migration-validate
    perf-tool-vet:
      priority: 30
      glob: "tools/desktop-perf/**/*.go"
      root: "tools/desktop-perf/"
      run: go vet ./...
    # Run the same one-command gate used by pre-push. It is last because earlier
    # hook commands can rewrite and re-stage source/configuration files.
    desktop-verify:
      # Lefthook treats priority 0 as +Infinity, so this runs after every
      # explicitly prioritized mutation/check above.
      priority: 0
      root: "apps/x/"
      glob: "apps/x/**"
      run: pnpm verify

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# pre-push runs the slower checks once, before sharing code — too slow for every
# commit, faster than waiting on CI. Skip on WIP branches with `LEFTHOOK=0 git push`.
#
# One sequential command on purpose: the renderer typecheck needs a FRESH
# @x/shared/@x/preload build, and `pnpm test` rebuilds @x/shared too — running
# them in parallel races on packages/shared/dist (a half-rebuilt dist makes tsc
# fail with "Cannot find @x/shared/dist/*.js"). `typecheck` builds deps first,
# then tsc -b; tests run after.
pre-push:
  commands:
    desktop-checks:
      root: "apps/x/"
      run: pnpm run verify
    rowboat-api-checks:
      root: "apps/rowboat-api/"
      run: make verify
    rowboat-www-checks:
      root: "apps/rowboat-www/"
      run: npm run verify
